name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · vet · test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libfuse3 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -tags fuse3 ./...

      - name: Vet
        run: go vet -tags fuse3 ./...

      - name: Test
        run: go test -tags fuse3 ./...
