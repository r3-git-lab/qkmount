name: Release

# Builds prebuilt binaries for Linux, macOS and Windows and attaches them to a
# GitHub Release.
#
#   * Pushing a version tag (e.g. v0.1.0) publishes a release.
#   * Running the workflow manually only builds + uploads the binaries, which is
#     handy for verifying the pipeline without creating a release.
#
# Build notes (QKMount links FUSE through cgo on Linux/macOS):
#   * Linux  : cgo + libfuse3 headers, built with `-tags fuse3`.
#   * macOS  : cgo + macFUSE headers (installed via the Homebrew cask).  macFUSE
#              is dlopen()ed at runtime, so no kext is needed to *build*.
#   * Windows: cgofuse ships a pure-Go WinFsp backend, so CGO is disabled and no
#              WinFsp SDK is needed at build time (WinFsp is only needed at run
#              time on the user's machine).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label used when building manually (e.g. v0.1.0)"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,   goarch: amd64, tags: "fuse3", cgo: "1" }
          - { runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64, tags: "fuse3", cgo: "1" }
          - { runner: macos-latest,     goos: darwin,  goarch: arm64, tags: "",      cgo: "1" }
          - { runner: macos-latest,     goos: darwin,  goarch: amd64, tags: "",      cgo: "1" }
          - { runner: ubuntu-latest,    goos: windows, goarch: amd64, tags: "",      cgo: "0" }
          - { runner: ubuntu-latest,    goos: windows, goarch: arm64, tags: "",      cgo: "0" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FUSE 3 headers (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Install macFUSE headers (macOS)
        if: matrix.goos == 'darwin'
        run: brew install macfuse

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          TAGS: ${{ matrix.tags }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          args=(-trimpath -ldflags "-s -w" -o "dist/qkmount$ext" ./cmd/qkmount)
          [ -n "$TAGS" ] && args=(-tags "$TAGS" "${args[@]}")
          go build "${args[@]}"

      - name: Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="${MANUAL_TAG:-v0.0.0-dev}"; fi
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          name="qkmount_${version}_${GOOS}_${GOARCH}"
          stage="stage/$name"
          mkdir -p "$stage"
          cp "dist/qkmount$ext" "$stage/"
          cp LICENSE README.md "$stage/"
          if [ "$GOOS" = "windows" ]; then
            ( cd stage && zip -qr "../dist/$name.zip" "$name" )
          else
            tar -czf "dist/$name.tar.gz" -C stage "$name"
          fi
          ls -l dist/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: qkmount-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
